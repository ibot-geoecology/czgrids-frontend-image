<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stahování výřezů (COG)</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-groupedlayercontrol@0.6.1/dist/leaflet.groupedlayercontrol.min.css" />

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .page-header {
            flex: 0 0 auto;
            padding: 1rem 1.25rem;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
        .page-header-inner {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
        }
        .page-title {
            margin: 0 0 0.5rem;
            font-size: 1.2rem;
        }
        .page-intro {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
        }
        .page-help-wrap {
            min-width: 0;
        }
        .page-help {
            margin: 0;
            color: #6c757d;
            font-size: 0.95rem;
        }
        .page-help + .page-help {
            margin-top: 0.2rem;
        }
        .page-actions {
            flex: 0 0 250px;
            max-width: 100%;
        }
        .page-controls-row {
            display: block;
        }
        .layer-opacity-panel {
            flex: 1 1 auto;
            min-width: 0;
        }
        .active-layer-name {
            margin: 0 0 0.25rem;
            color: #495057;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .download-action {
            flex: 0 0 auto;
            white-space: nowrap;
        }
        .map-shell {
            flex: 1 1 auto;
            min-height: 0;
            padding: 0.75rem;
            background: #e9ecef;
        }
        #map {
            height: 100%;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .leaflet-top.leaflet-right {
            top: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
        }
        .leaflet-right .leaflet-control {
            margin-bottom: 10px;
        }
        .leaflet-control-layers-expanded {
            display: flex;
            flex-direction: column;
            width: 150px;
            height: calc(100% - 50px);
            max-height: none;
            overflow: hidden;
            box-sizing: border-box;
        }
        .leaflet-control-layers-list {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .leaflet-control-layers-overlays {
            height: auto;
            max-height: none;
            overflow: visible;
            padding-right: 0.25rem;
            padding-bottom: 0.25rem;
        }
        @media (max-width: 768px) {
            .page-header-inner {
                flex-direction: column;
            }
            .page-actions {
                width: 100%;
                flex-basis: auto;
            }
            .page-intro {
                flex-direction: column;
            }
            .download-action {
                width: 100%;
            }
            .map-shell {
                padding: 0.5rem;
            }
            .leaflet-control-layers-expanded {
                width: 150px;
            }
        }
    </style>
</head>
<body class="bg-light">

<header class="page-header">
    <div class="page-header-inner">
        <div>
            <h1 class="page-title">Stahování dat</h1>
            <div class="page-intro">
                <div class="page-help-wrap">
                    <p class="page-help">1. Nakreslete obdélník do mapy pomocí nástroje se symbolem čtverce.</p>
                    <p class="page-help">2. Stáhněte tlačítkem:
                        <a id="downloadBtn" href="#" class="btn btn-primary disabled download-action">
                            Stáhnout GeoTIFF
                        </a>
                    </p>
                </div>
            </div>
        </div>
        <div class="page-actions">
            <div class="page-controls-row">
                <div class="layer-opacity-panel">
                    <p id="activeLayerName" class="active-layer-name">-</p>
                    <label for="opacitySlider" class="form-label mb-1" style="font-size:0.85rem;color:#6c757d">
                        Průhlednost vrstvy: <span id="opacityValue">80 %</span>
                    </label>
                    <input type="range" class="form-range" id="opacitySlider" min="0" max="1" step="0.05" value="0.8">
                </div>
            </div>
        </div>
    </div>
</header>

<main class="map-shell">
    <div id="map"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-groupedlayercontrol@0.6.1/dist/leaflet.groupedlayercontrol.min.js"></script>

<script>
    const map = L.map('map').setView([49.8, 15.9], 8);
    const titilerAddress = "https://czgrids.dyn.cloud.e-infra.cz";
    const layersConfigUrl = './layers.json';
    const sourceMapCrs = 'EPSG:4326';
    const outputDownloadCrs = 'EPSG:32633';
    let currentLayerConfig = null;
    let currentLeafletLayer = null;
    let currentSelectionBounds = null;
    let currentSelectionLayer = null;
    let layerControl = null;
    const cogLayers = [];

    function populateLayerRescale(layerConfig) {
        const minValue = Number(layerConfig.colors_min);
        const maxValue = Number(layerConfig.colors_max);

        if (Number.isFinite(minValue) && Number.isFinite(maxValue) && minValue !== maxValue) {
            layerConfig.rescale = `${minValue},${maxValue}`;
        }

        return layerConfig;
    }

    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        referrerPolicy: 'origin'
    }).addTo(map);
    const baseLayers = { 'OpenStreetMap': osmLayer };
    layerControl = L.control.groupedLayers(baseLayers, {}, { collapsed: false }).addTo(map);

    function buildTitilerTilesUrl(layerConfig) {
        const params = new URLSearchParams({
            url: layerConfig.filename,
            bidx: '1'
        });

        if (layerConfig.rescale) {
            params.set('rescale', layerConfig.rescale);
        }

        if (layerConfig.colormap) {
            params.set('colormap_name', layerConfig.colormap);
        }

        return `${titilerAddress}/cog/tiles/WebMercatorQuad/{z}/{x}/{y}.png?${params.toString()}`;
    }

    function sanitizeFilenamePart(value) {
        return String(value)
            .trim()
            .replace(/\s+/g, '_')
            .replace(/[^A-Za-z0-9._-]/g, '_');
    }

    function buildDownloadFilename(layerConfig) {
        const groupName = sanitizeFilenamePart(layerConfig.groupName || 'layer');
        const layerName = sanitizeFilenamePart(layerConfig.name || 'data');

        return `${groupName}_${layerName}.tif`;
    }

    function updateLayerDisplay(layerConfig, leafletLayer) {
        const layerNameLabel = document.getElementById('activeLayerName');
        const slider = document.getElementById('opacitySlider');
        const opacityValue = document.getElementById('opacityValue');

        if (!layerConfig || !leafletLayer) {
            layerNameLabel.textContent = '-';
            slider.value = 0.8;
            opacityValue.textContent = '80 %';
            return;
        }

        layerNameLabel.textContent = `${layerConfig.groupName || '-'} ${layerConfig.name || '-'}`;
        const opVal = leafletLayer.options.opacity ?? 0.8;
        slider.value = opVal;
        opacityValue.textContent = Math.round(opVal * 100) + ' %';
    }

    function updateDownloadLink() {
        const btn = document.getElementById('downloadBtn');

        if (!currentLayerConfig || !currentSelectionBounds) {
            btn.href = '#';
            btn.dataset.downloadUrl = '';
            btn.dataset.downloadFilename = '';
            btn.classList.add('disabled');
            btn.classList.remove('btn-success');
            btn.classList.add('btn-primary');
            btn.innerText = 'Stáhnout GeoTIFF';
            return;
        }

        const minX = currentSelectionBounds.getWest().toFixed(5);
        const minY = currentSelectionBounds.getSouth().toFixed(5);
        const maxX = currentSelectionBounds.getEast().toFixed(5);
        const maxY = currentSelectionBounds.getNorth().toFixed(5);
        const params = new URLSearchParams({
            url: currentLayerConfig.filename,
            coord_crs: sourceMapCrs,
            dst_crs: outputDownloadCrs,
            bidx: '1',
            resampling_method: 'nearest',
            return_mask: 'false',
            nodata: 'nan'
        });

        const titilerUrl = `${titilerAddress}/cog/bbox/${minX},${minY},${maxX},${maxY}.tif?${params.toString()}`;
        const downloadFilename = buildDownloadFilename(currentLayerConfig);

        btn.href = titilerUrl;
        btn.dataset.downloadUrl = titilerUrl;
        btn.dataset.downloadFilename = downloadFilename;
        btn.classList.remove('disabled', 'btn-primary');
        btn.classList.add('btn-success');
        btn.innerText = `Stáhnout ${downloadFilename}`;
    }

    async function loadCogLayers() {
        try {
            const response = await fetch(layersConfigUrl);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const groups = await response.json();
            groups.forEach((group) => {
                group.layers.forEach((layerConfig) => populateLayerRescale(layerConfig));
            });
            const overlayLayers = [];

            groups.forEach((group) => {
                const groupName = group.group_name || 'Ostatni';

                group.layers.forEach((layerConfig) => {
                    layerConfig.groupName = groupName;
                    const cogLayer = L.tileLayer(buildTitilerTilesUrl(layerConfig), {
                        attribution: 'CZECH GRIDS 1.0',
                        opacity: 0.8,
                        crossOrigin: true
                    });
                    cogLayer.layerConfig = layerConfig;
                    cogLayers.push(cogLayer);

                    cogLayer.on('tileerror', (e) => {
                        console.error(`Chyba nacitani raster tile pro ${layerConfig.name}:`, e);
                    });

                    cogLayer.on('add', () => {
                        currentLayerConfig = layerConfig;
                        currentLeafletLayer = cogLayer;
                        updateLayerDisplay(currentLayerConfig, currentLeafletLayer);
                        updateDownloadLink();
                    });

                    const layerLabel = layerConfig.name;

                    overlayLayers.push({
                        groupName,
                        label: layerLabel,
                        layer: cogLayer,
                        config: layerConfig
                    });
                });
            });

            if (!overlayLayers.length) {
                throw new Error('V layers.json nejsou definovane zadne vrstvy.');
            }

            map.removeControl(layerControl);
            layerControl = L.control.groupedLayers(baseLayers, {}, { collapsed: false }).addTo(map);

            overlayLayers.forEach((overlayLayer) => {
                layerControl.addOverlay(overlayLayer.layer, overlayLayer.label, overlayLayer.groupName);
            });

            const defaultLayer = overlayLayers[0];
            currentLayerConfig = defaultLayer.config;
            defaultLayer.layer.addTo(map);
        } catch (error) {
            console.error('Nepodarilo se nacist layers.json:', error);
        }
    }

    map.on('overlayadd', (event) => {
        currentLayerConfig = event.layer.layerConfig || null;
        currentLeafletLayer = event.layer;
        updateLayerDisplay(currentLayerConfig, currentLeafletLayer);
        updateDownloadLink();
    });

    document.getElementById('opacitySlider').addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        document.getElementById('opacityValue').textContent = Math.round(val * 100) + ' %';
        if (currentLeafletLayer) {
            currentLeafletLayer.setOpacity(val);
        }
    });

    document.getElementById('downloadBtn').addEventListener('click', async (event) => {
        const btn = event.currentTarget;
        const downloadUrl = btn.dataset.downloadUrl;
        const downloadFilename = btn.dataset.downloadFilename || 'download.tif';

        if (btn.classList.contains('disabled') || !downloadUrl) {
            event.preventDefault();
            return;
        }

        event.preventDefault();

        const originalText = btn.innerText;

        try {
            btn.classList.add('disabled');
            btn.innerText = 'Stahuji...';

            const response = await fetch(downloadUrl);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const blob = await response.blob();
            const objectUrl = URL.createObjectURL(blob);
            const link = document.createElement('a');

            link.href = objectUrl;
            link.download = downloadFilename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(objectUrl);
        } catch (error) {
            console.error('Nepodarilo se stahnout GeoTIFF:', error);
            window.open(downloadUrl, '_blank', 'noopener');
        } finally {
            btn.classList.remove('disabled');
            btn.innerText = originalText;
        }
    });

    loadCogLayers();

    map.pm.addControls({
        position: 'topleft',
        drawMarker: false,
        drawCircleMarker: false,
        drawPolyline: false,
        drawPolygon: false,
        drawCircle: false,
        drawText: false,
        drawRectangle: true,
        editMode: true,
        rotateMode: false,
        dragMode: false,
        cutPolygon: false,
        removalMode: true,
    });

    map.on('pm:create', (e) => {
        const layer = e.layer;

        if (currentSelectionLayer && currentSelectionLayer !== layer && map.hasLayer(currentSelectionLayer)) {
            map.removeLayer(currentSelectionLayer);
        }

        currentSelectionLayer = layer;
        
        currentSelectionBounds = layer.getBounds();
        
        const minX = currentSelectionBounds.getWest().toFixed(5);
        const minY = currentSelectionBounds.getSouth().toFixed(5);
        const maxX = currentSelectionBounds.getEast().toFixed(5);
        const maxY = currentSelectionBounds.getNorth().toFixed(5);

        console.log(`Vybrán BBox: ${minX}, ${minY}, ${maxX}, ${maxY}`);

        updateDownloadLink();
    });

    map.on('pm:remove', () => {
        currentSelectionLayer = null;
        currentSelectionBounds = null;
        updateDownloadLink();
    });
</script>
</body>
</html>
